# 允許本機開發時從專案根目錄載入機密設定；作業系統環境變數及 Docker secrets 仍可覆寫。
spring.application.name=mcp-ticket-server
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:configtree:/run/secrets/

# MCP 報修服務連接埠，可用 MCP_SERVER_PORT 環境變數覆寫。
server.port=${MCP_SERVER_PORT:8081}

# MySQL 連線位置；Docker Compose 會以 mysql 服務名稱連線，本機開發使用 localhost。
spring.datasource.url=${TICKET_DB_URL:jdbc:mysql://localhost:3306/ticket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei}
# 資料庫帳號是非機密設定，可由 TICKET_DB_USERNAME 環境變數覆寫。
spring.datasource.username=${TICKET_DB_USERNAME:root}
# 資料庫密碼從機密環境變數或 Docker secret 讀取。
spring.datasource.password=${TICKET_DB_PASSWORD:${db_password}}

# JPA 僅驗證既有結構，資料表版本由 Flyway 管理。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# MCP Server 使用同步的 Streamable HTTP 協定。
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.annotation-scanner.enabled=true
