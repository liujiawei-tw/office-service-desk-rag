# 允許從專案根目錄的 .env 自動載入 Gemini API 金鑰，並保留 OS 環境變數優先。
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY:}
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.max-output-tokens=2048

# 本機 ONNX 向量模型名稱可用 EMBEDDING_MODEL 環境變數覆寫。
helpdesk.embedding.model=${EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/${helpdesk.embedding.model}/resolve/refs%2Fpr%2F36/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/${helpdesk.embedding.model}/resolve/main/tokenizer.json
spring.ai.embedding.transformer.onnx.model-output-name=last_hidden_state
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.tokenizer.options.truncation=true
spring.ai.embedding.transformer.tokenizer.options.maxLength=${RAG_EMBEDDING_MAX_LENGTH:512}
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${java.io.tmpdir}/spring-ai-bge-large-zh-v1.5

# MCP Client 使用同步 Streamable HTTP，連線到獨立的報修單服務。
# 可由 TICKET_SERVER_HOST / TICKET_SERVER_PORT 覆寫，避免 8081 佔用時無法啟動。
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.ticket-server.url=http://${TICKET_SERVER_HOST:localhost}:${TICKET_SERVER_PORT:8081}

# 從 helpdesk-ai 的 classpath resources 載入 TXT；ticket_status.txt 由載入器排除。
helpdesk.knowledge-pattern=classpath*:/knowledge/*.txt

# RAG chunking and retrieval controls; override via the matching environment variables.
helpdesk.rag.chunk-size=${RAG_CHUNK_SIZE:300}
helpdesk.rag.min-chunk-size-chars=${RAG_MIN_CHUNK_SIZE_CHARS:100}
helpdesk.rag.min-chunk-length-to-embed=${RAG_MIN_CHUNK_LENGTH_TO_EMBED:5}
helpdesk.rag.keep-separator=${RAG_KEEP_SEPARATOR:true}
helpdesk.rag.top-k=${RAG_TOP_K:4}
helpdesk.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.3}

# AI/RAG REST API 的本機開發連接埠。
server.port=${HELPDESK_PORT:8080}
helpdesk.chat.temperature=${HELPDESK_CHAT_TEMPERATURE:0.3}
spring.application.name=helpdesk-ai

